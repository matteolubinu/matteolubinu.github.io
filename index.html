<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matteo Lubinu</title>
<meta name="description" content="Matteo Lubinu — UX designer & iOS app builder">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="avatar" src="assets/photo.jpg" alt="Matteo Lubinu" width="112" height="112">
      <h1>Matteo Lubinu</h1>
      <p class="bio">UI/UX designer 🎨 · homebody 🌱 · sports, video games &amp; bass player 🎸</p>

      <div class="socials">
        <a href="https://instagram.com/matteolubi" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/matteo-lubinu/" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7.5" y1="10.5" x2="7.5" y2="17"/><circle cx="7.5" cy="7" r="0.2" fill="currentColor"/><path d="M11.5 17v-4a2.5 2.5 0 0 1 5 0v4"/><line x1="11.5" y1="10.5" x2="11.5" y2="17"/></svg>
        </a>
      </div>
    </section>

    <section class="projects">
      <h2>Projects</h2>

      <div class="project-list">
        <!-- Il titolo è il link al sito del progetto e si allarga a tutta la card
             (`.project-link::after`); il badge App Store resta un link separato, sopra —
             niente <a> annidati, che l'HTML non permette. -->
        <div class="project">
          <img class="project-icon" src="assets/quillino-icon.png" alt="Quillino" width="48" height="48">
          <div class="project-body">
            <h3><a class="project-link" href="https://matteolubinu.github.io/quillino/">Quillino <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></h3>
            <p>Simple rental management for landlords.</p>
          </div>
          <a class="project-cta" href="https://apps.apple.com/it/app/quillino-gestione-affitti/id6774200347" aria-label="Quillino on the App Store">
            <img class="badge-live-img"
                 src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                 alt="Download on the App Store" width="120" height="40">
          </a>
        </div>

        <div class="project">
          <img class="project-icon" src="assets/refertrack-icon.png" alt="Refertrack" width="48" height="48">
          <div class="project-body">
            <h3><a class="project-link" href="https://matteolubinu.github.io/refertrack/">Refertrack <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></h3>
            <p>Track your lab results over time.</p>
          </div>
          <a class="project-cta" href="https://apps.apple.com/it/app/refertrack-referti-ed-esami/id6792460771" aria-label="Refertrack on the App Store">
            <img class="badge-live-img"
                 src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                 alt="Download on the App Store" width="120" height="40">
          </a>
        </div>
      </div>
    </section>

    <footer>
      <p>Made with ❤️</p>
    </footer>
  </main>
</body>
</html>
